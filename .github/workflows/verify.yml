name: Verify lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - uses: ./
        with:
          report: reliability-report.json
      - uses: ./
        with:
          sender: examples/custom-sender.mjs
          report: custom-sender-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-report-${{ runner.os }}
          path: |
            reliability-report.json
            custom-sender-report.json
